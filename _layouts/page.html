---
layout: default
---
<header class="page-head">
  <svg class="topo" data-topo="1000,200,18,15,3.1" data-draw viewBox="0 0 1200 380" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
  <div class="wrap page-head-inner">
    {% if page.eyebrow %}<p class="mono">{{ page.eyebrow }}</p>{% endif %}
    <h1 class="page-title">{{ page.heading | default: page.title }}</h1>
    {% if page.subtitle %}<p class="page-subtitle">{{ page.subtitle }}</p>{% endif %}
  </div>
</header>

<div class="page-body">
  <div class="wrap">
    {{ content }}
  </div>
</div>
