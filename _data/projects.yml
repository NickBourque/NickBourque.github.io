- title: "Poopy Goose"
  kind: "Video game"
  status: "In development"
  role: "Creator"
  summary: "A cozy-chaos game about a very cute paper goose with a very bad habit."
  description: |
    Poopy Goose is the game I'm building under my indie label, Poopy Goose Studio. You play a sweet
    goose with no manners, waddling through a little world made of paper: swipe snacks, honk at the
    worst possible moment, and turn everyone's tidy plans into feathery mayhem. He means well. Mostly.

    Everything in it is a flat paper cut-out with a thick ink outline and a white sticker border,
    standing in a small 3D diorama, so characters turn like sheets of card rather than 3D models.
    The game is built in Unity, and the studio site runs the same paper world in the browser with three.js.
  tech: ["Unity", "C#", "three.js", "Illustration"]
