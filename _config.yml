title: Nick Bourque
tagline: Senior Software Engineer
location: "Halifax, Nova Scotia, Canada"
locale: en_CA
description: "Nick Bourque is a senior software engineer in Halifax, Nova Scotia, building the backend for ArborXR's XR device-management platform."
email: nickabourque@gmail.com

# Social settings
github_username: NickBourque
linkedin_username: nick-bourque
gitlab_username: nickabourque

# URL configuration for GitHub Pages
url: "https://nick-bourque.ca"
baseurl: ""

# Permalinks for blog posts
permalink: /blog/:title/

# Plugins
plugins:
  - jekyll-sitemap

# Sass compilation settings
sass:
  style: compressed

# Temporarily disabled sections — excluded from the build so they are inaccessible.
# Remove these entries (and re-enable the commented nav/home blocks in
# _layouts/default.html and index.html) to bring them back.
exclude:
  - blog
  - _posts
  # Jekyll's default excludes (must be re-listed since a custom `exclude` replaces them)
  - vendor
  - .bundle
  - Gemfile
  - Gemfile.lock
  - .sass-cache
  - .jekyll-cache
  # Build-time helper, not part of the site
  - scripts
  - README.md
